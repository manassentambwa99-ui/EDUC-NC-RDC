name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://manassentambwa99-ui.github.io/EDUC-NC-RDC/
      APP_ID: cd.educ.nationale.app
      APP_NAME: EDUC National
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Create Android project
        run: |
          mkdir -p build/www
          cd build
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '<!doctype html><meta charset="utf-8"><title>EDUC National</title><body>EDUC National</body>' > www/index.html
          printf '{"appId":"%s","appName":"%s","webDir":"www","server":{"url":"%s","cleartext":false,"allowNavigation":["manassentambwa99-ui.github.io","*.workers.dev","newsdata.io","serpapi.com","commons.wikimedia.org","upload.wikimedia.org","cdnjs.cloudflare.com","fonts.googleapis.com","fonts.gstatic.com"]}}' "$APP_ID" "$APP_NAME" "$SITE_URL" > capacitor.config.json
          npx cap add android

      - name: App icon
        run: |
          cd build/android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for d in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $d
            mkdir -p mipmap-$1
            convert "$GITHUB_WORKSPACE/logoo.png" -resize $2x$2 -background none -gravity center -extent $2x$2 mipmap-$1/ic_launcher.png
            cp mipmap-$1/ic_launcher.png mipmap-$1/ic_launcher_round.png
            rm -f mipmap-$1/ic_launcher_foreground.png
          done

      - name: Build APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/android/app/build/outputs/apk/debug/app-debug.apk EDUC-National.apk
          gh release create "apk-${{ github.run_number }}" EDUC-National.apk --title "EDUC National Android ${{ github.run_number }}" --notes "Install EDUC-National.apk on an Android phone."
