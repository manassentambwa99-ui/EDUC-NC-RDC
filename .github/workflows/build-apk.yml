name: Build TWA APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  twa:
    runs-on: ubuntu-latest
    env:
      HOST: manassentambwa99-ui.github.io
      SITE: https://manassentambwa99-ui.github.io/EDUC-NC-RDC/
      PACKAGE_ID: cd.educ.nationale.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Create signing key
        run: |
          mkdir -p twa
          keytool -genkeypair -v -keystore twa/android.keystore -alias educ -keyalg RSA -keysize 2048 -validity 10000 -storepass educ-National-2026 -keypass educ-National-2026 -dname "CN=EDUC National, OU=EDUC, O=EDUC, L=Kinshasa, C=CD"
          keytool -list -v -keystore twa/android.keystore -alias educ -storepass educ-National-2026 | grep SHA256 | tee twa/sha256.txt

      - name: Write TWA manifest
        run: |
          cat > twa/twa-manifest.json <<JSON
          {
            "packageId": "$PACKAGE_ID",
            "host": "$HOST",
            "name": "EDUC National",
            "launcherName": "EDUC",
            "display": "standalone",
            "themeColor": "#0057d9",
            "themeColorDark": "#0057d9",
            "navigationColor": "#0057d9",
            "navigationColorDark": "#0057d9",
            "navigationDividerColor": "#0057d9",
            "navigationDividerColorDark": "#0057d9",
            "backgroundColor": "#0a6ae6",
            "enableNotifications": true,
            "startUrl": "/EDUC-NC-RDC/",
            "iconUrl": "${SITE}logoo.png",
            "maskableIconUrl": "${SITE}logoo.png",
            "appVersion": "1",
            "appVersionCode": 1,
            "signingKey": { "path": "./android.keystore", "alias": "educ" },
            "splashScreenFadeOutDuration": 300,
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "${SITE}",
            "minSdkVersion": 21,
            "orientation": "portrait",
            "fallbackType": "customtabs",
            "webManifestUrl": "${SITE}manifest-v2.json",
            "features": {},
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli"
          }
          JSON
          cat twa/twa-manifest.json

      - name: Generate Android project
        working-directory: twa
        run: bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      - name: Build
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: educ-National-2026
          BUBBLEWRAP_KEY_PASSWORD: educ-National-2026
        run: bubblewrap build --skipPwaValidation

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la twa
          cp twa/app-release-signed.apk EDUC-National-TWA.apk
          cp twa/app-release-bundle.aab EDUC-National.aab || true
          gh release create "twa-${{ github.run_number }}" EDUC-National-TWA.apk EDUC-National.aab --title "EDUC National TWA ${{ github.run_number }}" --notes "Install EDUC-National-TWA.apk. $(cat twa/sha256.txt)"
