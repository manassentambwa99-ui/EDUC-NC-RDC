here# EDUC National : fabrique l'application Android (APK) directement depuis ton dépôt GitHub.
# Lancement : onglet "Actions" > "Construire l'application Android" > "Run workflow".
# Résultat : un fichier EDUC-National.apk dans l'onglet "Releases" du dépôt (lien public, installable sur n'importe quel téléphone).
name: Construire l'application Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://manassentambwa99-ui.github.io/EDUC-NC-RDC/
      APP_ID: cd.educ.nationale.app
      APP_NAME: EDUC National
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node et Java
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Outils d'image
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Créer le projet Android
        run: |
          mkdir -p build/www
          cd build
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > www/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <body style="margin:0;display:flex;align-items:center;justify-content:center;height:100vh;background:#0a6ae6;color:#fff;font-family:sans-serif;text-align:center">
          <div><h2>EDUC National</h2><p>Connexion requise pour la première ouverture.</p></div>
          HTML
          cat > capacitor.config.json <<JSON
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "server": {
              "url": "$SITE_URL",
              "cleartext": false,
              "allowNavigation": ["manassentambwa99-ui.github.io", "*.workers.dev", "newsdata.io", "serpapi.com", "commons.wikimedia.org", "upload.wikimedia.org", "cdnjs.cloudflare.com", "fonts.googleapis.com", "fonts.gstatic.com"]
            },
            "android": { "allowMixedContent": false }
          }
          JSON
          npx cap add android

      - name: Icône de l'application (ton logo)
        run: |
          cd build/android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for d in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $d
            mkdir -p mipmap-$1
            convert "$GITHUB_WORKSPACE/logoo.png" -resize $2x$2 -background none -gravity center -extent $2x$2 mipmap-$1/ic_launcher.png
            cp mipmap-$1/ic_launcher.png mipmap-$1/ic_launcher_round.png
            rm -f mipmap-$1/ic_launcher_foreground.png
          done

      - name: Construire l'APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK (lien téléchargeable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/android/app/build/outputs/apk/debug/app-debug.apk EDUC-National.apk
          gh release create "apk-${{ github.run_number }}" EDUC-National.apk \
            --title "EDUC National (Android) - version ${{ github.run_number }}" \
            --notes "Installe EDUC-National.apk sur ton téléphone Android. L'application charge le site à jour à chaque ouverture."
